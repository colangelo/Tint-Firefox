<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Window Color Picker</title>
    <style>
        body {
            width: 360px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        
        h3 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: 18px;
        }
        
        .preset-colors {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }
        
        .color-option {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            position: relative;
            margin: 2px;
        }
        
        .color-option:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .color-option.selected {
            border-color: #333;
        }
        
        .color-option.selected::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
        
        .color-harmony-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        
        .harmony-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .harmony-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .harmony-btn:hover {
            background: #f0f0f0;
            border-color: #999;
        }
        
        .harmony-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        .harmony-colors {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            min-height: 30px;
        }
        
        .harmony-color {
            width: 100%;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        
        .harmony-color:hover {
            transform: scale(1.05);
            border-color: #333;
        }
        
        .custom-color-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        
        .palette-generator {
            margin-top: 10px;
            text-align: center;
        }
        
        .palette-btn {
            padding: 8px 16px;
            border: 1px solid #2196F3;
            border-radius: 4px;
            background: #2196F3;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .palette-btn:hover {
            background: #1976D2;
        }
        
        .generated-palette-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        
        .generated-palette {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }
        
        .generated-color {
            width: 100%;
            height: 25px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        
        .generated-color:hover {
            transform: scale(1.05);
            border-color: #333;
        }
        
        .clear-btn {
            padding: 6px 12px;
            border: 1px solid #f44336;
            border-radius: 4px;
            background: white;
            color: #f44336;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            float: right;
        }
        
        .clear-btn:hover {
            background: #f44336;
            color: white;
        }
        
        .color-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        #colorPicker {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #colorValue {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        #applyBtn {
            background: #4CAF50;
            color: white;
        }
        
        #applyBtn:hover {
            background: #45a049;
        }
        
        #resetBtn {
            background: #f44336;
            color: white;
        }
        
        #resetBtn:hover {
            background: #da190b;
        }
    </style>
</head>
<body>
    <h3>Choose Window Color</h3>
    
    <div class="preset-colors" id="presetColors"></div>
    
    <div class="generated-palette-section" id="generatedPaletteSection" style="display: none;">
        <h4>Generated Palette</h4>
        <div class="generated-palette" id="generatedPalette"></div>
        <button id="clearPaletteBtn" class="clear-btn">Clear Generated Palette</button>
    </div>
    
    <div class="color-harmony-section">
        <h4>Color Harmony</h4>
        <div class="harmony-buttons">
            <button id="complementaryBtn" class="harmony-btn">Complementary</button>
            <button id="triadicBtn" class="harmony-btn">Triadic</button>
            <button id="analogousBtn" class="harmony-btn">Analogous</button>
            <button id="monochromaticBtn" class="harmony-btn">Monochromatic</button>
        </div>
        <div class="harmony-colors" id="harmonyColors"></div>
    </div>
    
    <div class="custom-color-section">
        <h4>Custom Color</h4>
        <div class="color-input-wrapper">
            <input type="color" id="colorPicker" value="#6699cc">
            <input type="text" id="colorValue" value="#6699cc" placeholder="#RRGGBB">
        </div>
        <div class="palette-generator">
            <button id="generatePaletteBtn" class="palette-btn">Generate Palette</button>
        </div>
    </div>
    
    <div class="buttons">
        <button id="applyBtn">Apply Color</button>
        <button id="resetBtn">Reset to Auto</button>
    </div>
    
    <script src="color-utils.js"></script>
    <script src="color-picker.js"></script>
</body>
</html>
